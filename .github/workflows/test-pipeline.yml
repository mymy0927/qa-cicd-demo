name: QA 自动化巡检流水线

on:
  push:
    branches: [ "main" ] # 只要 main 分支有提交，就触发
  workflow_dispatch: # 允许手动点击按钮触发

jobs:
  run-test:
    runs-on: ubuntu-latest # 向 GitHub 租一台干净的 Linux 机器跑测试

    steps:
    # 步骤 1：CI 的拉取代码
    - name: 1. 拉取最新代码
      uses: actions/checkout@v3

    # 步骤 2：CI 的环境构建
    - name: 2. 配置 Python 环境
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    # 步骤 3：执行你的测试脚本
    - name: 3. 执行巡检测试脚本
      run: python test_check.py
